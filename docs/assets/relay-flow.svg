<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Architecture diagram showing how model-relay routes Claude Code sessions, haiku subagents, and 429 failovers across Claude, GLM, DeepSeek, and Gemini with sticky session protection">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { fill: #e6edf3; font-size: 14px; font-weight: 600; }
      .sub { fill: #8b949e; font-size: 12px; }
      .code { fill: #c9d1d9; font-size: 12.5px; }
      .tag-blue { fill: #38bdf8; }
      .tag-purple { fill: #a78bfa; }
      .tag-green { fill: #34d399; }
      .tag-amber { fill: #fbbf24; }
      .flow { stroke-dasharray: 6 6; animation: dash 1.8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0d1117"/>

  <!-- Column 1: Claude Code Sessions -->
  <g transform="translate(24 24)">
    <rect width="268" height="372" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="20" cy="22" r="4.5" fill="#f87171"/>
    <circle cx="36" cy="22" r="4.5" fill="#fbbf24"/>
    <circle cx="52" cy="22" r="4.5" fill="#4ade80"/>
    <text x="134" y="26" text-anchor="middle" class="sans title">Claude Code Sessions</text>

    <!-- Session A: Main on Claude / 429 Failover -->
    <rect x="16" y="48" width="236" height="92" rx="10" fill="#0f1724" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="28" y="70" class="mono code"><tspan class="tag-blue">●</tspan> Session #1 (Main)</text>
    <text x="28" y="92" class="sans sub">Normal: routes to Claude Opus/Sonnet</text>
    <text x="28" y="110" class="sans sub"><tspan class="tag-amber">On 429 limit:</tspan> sticky failover → GLM</text>
    <text x="28" y="128" class="sans sub">(stays on GLM so 800k cache isn't rebuilt)</text>

    <!-- Session B: Pinned via /provider -->
    <rect x="16" y="156" width="236" height="88" rx="10" fill="#0f1724" stroke="#34d399" stroke-width="1.5"/>
    <text x="28" y="178" class="mono code"><tspan class="tag-green">●</tspan> Session #2 (/provider gemini)</text>
    <text x="28" y="200" class="mono sub">&gt; /provider gemini</text>
    <text x="28" y="218" class="sans sub">Pinned to Gemini 4 Argon</text>
    <text x="28" y="234" class="sans sub">Other open windows stay on Claude</text>

    <!-- Subagent: Haiku matchModels -->
    <rect x="16" y="260" width="236" height="92" rx="10" fill="#0f1724" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="28" y="282" class="mono code"><tspan class="tag-purple">●</tspan> Subagent (model: haiku)</text>
    <text x="28" y="304" class="sans sub">Matched by matchModels: ["haiku"]</text>
    <text x="28" y="322" class="sans sub">Offloaded to GLM 5.3 [1m] while</text>
    <text x="28" y="340" class="sans sub">main thread remains on Claude</text>
  </g>

  <!-- Arrows Col 1 -> Col 2 -->
  <path d="M292 118 L344 118" stroke="#38bdf8" stroke-width="2" class="flow"/>
  <path d="M292 224 L344 224" stroke="#34d399" stroke-width="2" class="flow"/>
  <path d="M292 330 L344 330" stroke="#a78bfa" stroke-width="2" class="flow"/>

  <!-- Column 2: model-relay Local Router -->
  <g transform="translate(344 24)">
    <rect width="272" height="372" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="2"/>
    <text x="136" y="28" text-anchor="middle" class="mono title">model-relay (127.0.0.1:8950)</text>

    <!-- Decision Engine -->
    <rect x="18" y="48" width="236" height="96" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="30" y="70" class="sans title">1. Route Decision (router/logic.js)</text>
    <text x="30" y="92" class="mono sub">• matchModels regex → provider</text>
    <text x="30" y="110" class="mono sub">• sticky[sid]       → pinned provider</text>
    <text x="30" y="128" class="mono sub">• 429 cooldown      → failover / trial</text>

    <!-- Quirk Sanitizer -->
    <rect x="18" y="160" width="236" height="96" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="30" y="182" class="sans title">2. Per-Provider Quirk Sanitizer</text>
    <text x="30" y="204" class="mono sub">• stripToolSearch: true (z.ai/DS)</text>
    <text x="30" y="222" class="mono sub">• stripCacheControl: true (Gemini)</text>
    <text x="30" y="240" class="mono sub">• wireModel: glm-5.3[1m] → glm-5.3</text>

    <!-- Supervision & Bypass -->
    <rect x="18" y="272" width="236" height="80" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="30" y="294" class="sans title">3. Self-Healing &amp; Gateway Launch</text>
    <text x="30" y="316" class="mono sub">• Auto-spawns local gateway if down</text>
    <text x="30" y="334" class="mono sub">• Direct Claude fallback if offline</text>
  </g>

  <!-- Arrows Col 2 -> Col 3 -->
  <path d="M616 105 L668 105" stroke="#38bdf8" stroke-width="2" class="flow"/>
  <path d="M616 214 L668 214" stroke="#a78bfa" stroke-width="2" class="flow"/>
  <path d="M616 320 L668 320" stroke="#34d399" stroke-width="2" class="flow"/>

  <!-- Column 3: Upstream Providers -->
  <g transform="translate(668 24)">
    <rect width="268" height="372" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="134" y="28" text-anchor="middle" class="sans title">Upstream Providers</text>

    <!-- Anthropic -->
    <rect x="16" y="48" width="236" height="92" rx="10" fill="#0f1724" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="28" y="72" class="mono title"><tspan class="tag-blue">●</tspan> Anthropic Claude</text>
    <text x="28" y="94" class="mono sub">https://api.anthropic.com</text>
    <text x="28" y="114" class="sans sub">OAuth subscription / API key</text>
    <text x="28" y="130" class="sans sub">Full prompt cache preserved</text>

    <!-- GLM / DeepSeek / Kimi -->
    <rect x="16" y="156" width="236" height="92" rx="10" fill="#0f1724" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="28" y="180" class="mono title"><tspan class="tag-purple">●</tspan> GLM / DeepSeek / Kimi</text>
    <text x="28" y="202" class="mono sub">preset: zai | deepseek | kimi</text>
    <text x="28" y="222" class="sans sub">ToolSearch stripped automatically</text>
    <text x="28" y="238" class="sans sub">Token via env:ZAI_API_KEY</text>

    <!-- Local Gateway (Gemini / Magpie) -->
    <rect x="16" y="264" width="236" height="88" rx="10" fill="#0f1724" stroke="#34d399" stroke-width="1.5"/>
    <text x="28" y="288" class="mono title"><tspan class="tag-green">●</tspan> Local Gateway (Gemini)</text>
    <text x="28" y="310" class="mono sub">http://127.0.0.1:3425</text>
    <text x="28" y="330" class="sans sub">cache_control stripped; auto-launched</text>
  </g>
</svg>
