<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="model-relay: multi-provider router and cache-safe failover for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pulse1 { animation: p1 6s ease-in-out infinite; }
      .pulse2 { animation: p2 6s ease-in-out infinite; }
      .pulse3 { animation: p3 6s ease-in-out infinite; }
      @keyframes p1 { 0%, 30% { opacity: 1; } 35%, 95% { opacity: 0.3; } 100% { opacity: 1; } }
      @keyframes p2 { 0%, 30% { opacity: 0.3; } 35%, 65% { opacity: 1; } 70%, 100% { opacity: 0.3; } }
      @keyframes p3 { 0%, 65% { opacity: 0.3; } 70%, 95% { opacity: 1; } 100% { opacity: 0.3; } }
      .dotMove { animation: dm 3s ease-in-out infinite; }
      @keyframes dm { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(88px, 0); opacity: 0; } }
    </style>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#dots)"/>

  <!-- Relay switchboard icon -->
  <g transform="translate(135 82)">
    <!-- Incoming session node -->
    <rect x="0" y="56" width="76" height="64" rx="16" fill="#161b22" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="38" y="84" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#7dd3fc">CC</text>
    <text x="38" y="102" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">:8950</text>

    <!-- Connecting paths -->
    <path d="M76 88 C 112 88, 116 32, 156 32" fill="none" stroke="#38bdf8" stroke-width="2.5" class="pulse1"/>
    <path d="M76 88 L 156 88" fill="none" stroke="#818cf8" stroke-width="2.5" class="pulse2"/>
    <path d="M76 88 C 112 88, 116 144, 156 144" fill="none" stroke="#34d399" stroke-width="2.5" class="pulse3"/>

    <circle cx="80" cy="88" r="4.5" fill="#38bdf8" class="dotMove"/>

    <!-- Target provider nodes -->
    <g class="pulse1">
      <rect x="156" y="8" width="118" height="48" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="176" cy="32" r="5" fill="#38bdf8"/>
      <text x="190" y="37" class="mono" font-size="14" font-weight="600" fill="#e6edf3">Claude</text>
    </g>
    <g class="pulse2">
      <rect x="156" y="64" width="118" height="48" rx="12" fill="#161b22" stroke="#818cf8" stroke-width="2"/>
      <circle cx="176" cy="88" r="5" fill="#818cf8"/>
      <text x="190" y="93" class="mono" font-size="14" font-weight="600" fill="#e6edf3">GLM 5.3</text>
    </g>
    <g class="pulse3">
      <rect x="156" y="120" width="118" height="48" rx="12" fill="#161b22" stroke="#34d399" stroke-width="2"/>
      <circle cx="176" cy="144" r="5" fill="#34d399"/>
      <text x="190" y="149" class="mono" font-size="14" font-weight="600" fill="#e6edf3">Gemini</text>
    </g>
  </g>

  <text x="455" y="154" class="mono" font-size="84" font-weight="700" fill="#e6edf3" letter-spacing="-2">model<tspan fill="url(#accent)">-</tspan>relay</text>
  <text x="459" y="206" class="sans" font-size="28" fill="#c9d1d9">Multi-provider router &amp; cache-safe failover for Claude Code</text>
  <text x="459" y="250" class="sans" font-size="20" fill="#8b949e">Per-session /provider · Sticky 429 failover · Subagent routing · Quirk sanitizer</text>
</svg>
